[pytest]
asyncio_mode = auto
testpaths = tests
# Per-test ceiling (seconds): a hung network-dependent test fails instead of
# eating the whole CI budget. 600s is a hang-guard, not a performance bar —
# no legitimate unit test here takes minutes (full suite ≈11 min for ~4900).
timeout = 600
timeout_method = thread
norecursedirs = service_tests
ignore = tests/service_tests
markers =
    flaky: marks tests as flaky (may fail due to external API dependencies)
    flaky_env: environment-dependent (API keys present/absent) — excluded in CI via -m "not flaky_env"
    slow: marks tests as slow (external API calls, timeouts > 30s)
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:numba.*
    ignore::pytest.PytestRemovedIn10Warning
