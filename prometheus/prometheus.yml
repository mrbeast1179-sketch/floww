global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts/oracle.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "floww-oracle"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"
    scrape_interval: 5s
