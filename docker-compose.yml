version: "3.8"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # NOTE: No auth enabled for local dev. For production, use MongoDB Atlas
    # or enable auth with --auth flag and MONGO_INITDB_ROOT_USERNAME/PASSWORD
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=confluence_decoder
    depends_on:
      - mongo
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # NOTE: REACT_APP_BACKEND_URL must be set at build time for CRA.
    # The env var here only affects runtime. For production, build with:
    # docker build --build-arg REACT_APP_BACKEND_URL=https://your-domain.com -f Dockerfile.frontend .
    depends_on:
      - backend

volumes:
  mongo_data:
