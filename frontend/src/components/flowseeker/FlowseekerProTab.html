<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Flowseeker Pro — CVForge</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0b0d12; color:#e6e8ee; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
    #root { min-height:100vh; }
    .hidden { display:none!important; }
    .app-shell { display:flex; flex-direction:column; height:100vh; }
    .top-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#11141a; border-bottom:1px solid rgba(255,255,255,.08); flex-shrink:0; }
    .top-bar h1 { font-size:14px; font-weight:700; margin:0; color:#e6e8ee; }
    .top-bar .badge { font-size:10px; padding:2px 8px; border-radius:10px; background:rgba(34,197,94,.15); color:#22c55e; font-weight:600; }
    .top-bar .badge.offline { background:rgba(239,68,68,.15); color:#ef4444; }
    .main-area { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:260px; flex-shrink:0; background:#0d0f14; border-right:1px solid rgba(255,255,255,.06); overflow-y:auto; padding:12px; }
    .content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .ticker-input { width:100%; background:#161a22; border:1px solid rgba(255,255,255,.1); border-radius:8px; color:#e6e8ee; font-size:14px; padding:8px 12px; outline:none; box-sizing:border-box; }
    .ticker-input:focus { border-color:#3b82f6; }
    .ticker-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
    .ticker-chip { font-size:11px; padding:3px 10px; border-radius:12px; background:rgba(59,130,246,.12); color:#60a5fa; cursor:pointer; border:1px solid rgba(59,130,246,.2); transition:all .15s; }
    .ticker-chip:hover { background:rgba(59,130,246,.25); }
    .ticker-chip.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
    .filter-section { margin-top:16px; }
    .filter-label { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:#7a8599; margin-bottom:6px; font-weight:600; }
    .filter-row { display:flex; gap:6px; margin-bottom:6px; }
    .filter-select,.filter-input { flex:1; background:#161a22; border:1px solid rgba(255,255,255,.08); border-radius:6px; color:#e6e8ee; font-size:12px; padding:6px 8px; outline:none; }
    .chart-wrap { flex:1; min-height:300px; padding:12px; }
    .flow-tape { height:180px; flex-shrink:0; background:#0d0f14; border-top:1px solid rgba(255,255,255,.06); overflow-y:auto; padding:8px 12px; }
    .flow-tape-header { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:#7a8599; margin-bottom:6px; font-weight:600; display:flex; justify-content:space-between; }
    .flow-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:11px; border-bottom:1px solid rgba(255,255,255,.02); }
    .flow-time { color:#7a8599; min-width:55px; }
    .flow-ticker { color:#60a5fa; font-weight:600; min-width:38px; }
    .flow-type { font-size:9px; padding:1px 6px; border-radius:4px; font-weight:600; }
    .flow-type.sweep { background:rgba(239,68,68,.15); color:#ef4444; }
    .flow-type.block { background:rgba(234,179,8,.15); color:#eab308; }
    .flow-type.unusual { background:rgba(168,85,247,.15); color:#a855f7; }
    .flow-type.regular { background:rgba(120,120,120,.15); color:#888; }
    .flow-detail { color:#b0b8c4; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .flow-premium { color:#22c55e; font-weight:600; text-align:right; min-width:65px; }
    .status-bar { display:flex; align-items:center; gap:12px; padding:4px 14px; background:#0d0f14; border-top:1px solid rgba(255,255,255,.06); font-size:11px; color:#7a8599; flex-shrink:0; }
    .status-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; }
    .status-dot.loading { background:#eab308; animation:pulse 1s infinite; }
    .status-dot.error { background:#ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .empty { display:flex; align-items:center; justify-content:center; min-height:150px; opacity:.4; font-size:13px; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="./cv-bootstrap.js"></script>
<script>
(function(){
  'use strict';
  const TICKERS=['SPY','QQQ','IWM','DIA','TLT','AAPL','MSFT','NVDA','TSLA','AMZN','META','GOOGL'];
  let ticker='SPY', chainData=null, flowData=[], loading=false, error=null, lastUpdate=null;
  const root=document.getElementById('root');

  function render(){
    root.innerHTML='<div class="app-shell">'+
      '<div class="top-bar"><h1>⚡ FLOWSEEKER PRO</h1>'+
      '<span class="badge '+(error?'offline':'')+'">'+(error?'ERROR':'LIVE')+'</span>'+
      '<span style="margin-left:auto;font-size:11px;color:#7a8599">'+(lastUpdate?'Updated '+lastUpdate:'—')+'</span></div>'+
      '<div class="main-area">'+
      '<div class="sidebar">'+
      '<input class="ticker-input" id="tickerInput" value="'+ticker+'" placeholder="Ticker"/>'+
      '<div class="ticker-chips">'+TICKERS.map(t=>'<span class="ticker-chip '+(t===ticker?'active':'')+'" data-ticker="'+t+'">'+t+'</span>').join('')+'</div>'+
      '<div class="filter-section"><div class="filter-label">Flow Filters</div>'+
      '<div class="filter-row"><select class="filter-select" id="typeFilter">'+
      '<option value="all">All Types</option><option value="sweep">Sweeps</option>'+
      '<option value="block">Blocks</option><option value="unusual">Unusual</option>'+
      '<option value="regular">Regular</option></select>'+
      '<input class="filter-input" id="minPremium" type="number" value="0" placeholder="Min $"/></div></div>'+
      '<div class="filter-section"><div class="filter-label">Expiry</div>'+
      '<select class="filter-select" id="expiryFilter" style="width:100%"><option value="all">All Expiries</option></select></div>'+
      '</div>'+
      '<div class="content"><div class="chart-wrap">'+
      '<div style="font-size:12px;font-weight:600;color:#b0b8c4;padding:0 0 8px">Options Chain — '+ticker+'</div>'+
      '<div id="chainChart" style="height:calc(100% - 24px);"></div></div>'+
      '<div class="flow-tape"><div class="flow-tape-header"><span>Live Flow Tape</span><span id="flowCount">0 prints</span></div>'+
      '<div id="flowTape"><div class="empty">Waiting for flow data...</div></div></div>'+
      '</div></div>'+
      '<div class="status-bar"><span class="status-dot '+(loading?'loading':(error?'error':''))+'"></span>'+
      '<span>'+(loading?'Loading...':(error||'Connected — CVForge cvserver'))+'</span>'+
      '<span style="margin-left:auto">Data: CVForge cvserver</span></div></div>';
    bindEvents(); renderChart(); renderTape();
  }

  function bindEvents(){
    const inp=document.getElementById('tickerInput');
    if(inp) inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ticker=this.value.trim().toUpperCase();loadData();render();} });
    document.querySelectorAll('.ticker-chip').forEach(function(c){ c.addEventListener('click',function(){ticker=this.dataset.ticker;loadData();render();}); });
    const tf=document.getElementById('typeFilter'); if(tf) tf.addEventListener('change',function(){renderTape();});
    const mp=document.getElementById('minPremium'); if(mp) mp.addEventListener('change',function(){loadData();});
  }

  async function loadData(){
    loading=true; error=null; render();
    try {
      const fields=['expiration_date','strike_price','contract_type','implied_volatility','delta','gamma','theta','vega','bid','ask','midpoint','open_interest','day_volume','underlying_price'];
      const chain=await window.cvApi.chain(ticker, fields);
      chainData=chain;
      lastUpdate=new Date().toLocaleTimeString();
    } catch(e){ error=e.message; console.error('CVForge error:',e); }
    finally { loading=false; render(); }
  }

  function renderChart(){
    const el=document.getElementById('chainChart');
    if(!el) return;
    if(!chainData||!chainData.chain||chainData.chain.length===0){
      el.innerHTML='<div class="empty">No chain data — select a ticker</div>'; return;
    }
    const chain=chainData, exp=chain.chain[0], strikes=(exp.strikes||[]).map(s=>s[0]);
    const params=chain.params||[], dIdx=params.indexOf('delta'), oiIdx=params.indexOf('open_interest');
    const callOI=strikes.map(s=>{ const d=exp.strikes.find(x=>x[0]===s); return d&&d[1]?d[1][oiIdx]||0:0; });
    const putOI=strikes.map(s=>{ const d=exp.strikes.find(x=>x[0]===s); return d&&d[2]?-(d[2][oiIdx]||0):0; });
    const callD=strikes.map(s=>{ const d=exp.strikes.find(x=>x[0]===s); return d&&d[1]?d[1][dIdx]||null:null; });
    const putD=strikes.map(s=>{ const d=exp.strikes.find(x=>x[0]===s); return d&&d[2]?d[2][dIdx]||null:null; });
    Plotly.newPlot(el,[
      {x:strikes,y:callOI,type:'bar',name:'Call OI',marker:{color:'rgba(34,197,94,.6)'},yaxis:'y2'},
      {x:strikes,y:putOI,type:'bar',name:'Put OI',marker:{color:'rgba(239,68,68,.6)'},yaxis:'y2'},
      {x:strikes,y:callD,type:'scatter',mode:'lines+markers',name:'Call Δ',line:{color:'#22c55e',width:2},marker:{size:4}},
      {x:strikes,y:putD,type:'scatter',mode:'lines+markers',name:'Put Δ',line:{color:'#ef4444',width:2},marker:{size:4}},
    ],{
      paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',
      font:{color:'#7a8599',size:10},margin:{t:10,r:10,b:40,l:50},
      xaxis:{title:'Strike',gridcolor:'rgba(255,255,255,.05)'},
      yaxis:{title:'Delta',gridcolor:'rgba(255,255,255,.05)',side:'left'},
      yaxis2:{title:'OI',overlaying:'y',side:'right',showgrid:false},
      legend:{orientation:'h',y:1.1,font:{size:9}},hovermode:'x unified',
      displayModeBar:false
    });
  }

  function renderTape(){
    const el=document.getElementById('flowTape'); if(!el) return;
    const prints=flowData||[];
    document.getElementById('flowCount').textContent=prints.length+' prints';
    if(!prints.length){ el.innerHTML='<div class="empty">No flow data</div>'; return; }
    el.innerHTML=prints.slice(0,80).map(function(p){
      const t=p.timestamp?new Date(p.timestamp).toLocaleTimeString():'—';
      const prem=p.premium?'$'+(p.premium>=1000?(p.premium/1000).toFixed(0)+'k':p.premium.toFixed(0)):'—';
      return '<div class="flow-row"><span class="flow-time">'+t+'</span>'+
        '<span class="flow-ticker">'+(p.ticker||ticker)+'</span>'+
        '<span class="flow-type '+(p.classification||'regular')+'">'+(p.classification||'regular').toUpperCase()+'</span>'+
        '<span class="flow-detail">'+(p.side||'')+' '+(p.strike||'')+' '+(p.expiration||'')+' @ '+(p.price||'')+'</span>'+
        '<span class="flow-premium">'+prem+'</span></div>';
    }).join('');
  }

  render();
  loadData();
  setInterval(loadData,5000);
})();
</script>
</body>
</html>
