name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install "ruff==0.15.22"
      - name: Check F841 (unused variables)
        working-directory: backend
        run: ruff check . --select F841
      - name: Run full ruff check
        working-directory: backend
        run: ruff check .
      - name: Gate — no NEW silent except-pass without justification (GSD #11)
        working-directory: backend
        run: |
          # AST gate: any silent `except: pass` / `...` body must carry an
          # inline `# silent by design: <reason>` comment. Pre-existing
          # findings are frozen in qc/audit/silent_except_baseline.txt
          # (ratchet: only NEW handlers fail). Tests are exempt.
          python3 ../qc/audit/check_silent_except.py --root . \
            --baseline ../qc/audit/silent_except_baseline.txt
