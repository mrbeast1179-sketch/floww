name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Check F841 (unused variables)
        working-directory: backend
        run: ruff check . --select F841
      - name: Run full ruff check
        working-directory: backend
        run: ruff check .
