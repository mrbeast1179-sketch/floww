name: lint
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/lint.yml']
  push:
    branches: [main]
    paths: ['backend/**']
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: cd backend && ruff check .
