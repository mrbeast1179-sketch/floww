name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Truth audit
        run: bash qc/audit/truth_audit.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov bandit

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install "ruff==0.15.22"
          ruff check . --output-format=github

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install mypy
          mypy --ignore-missing-imports server.py || true

      - name: Security scan with bandit
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          bandit -r . --severity-level medium -q --exclude ./.venv,./tests --skip B101,B108,B301,B310,B313,B314,B324,B604,B608,B614,B615

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: confluence_decoder_test
          DATABENTO_API_KEY: ""
          POLYGON_API_KEY: ""
          ALPHA_VANTAGE_KEY: ""
          FINNHUB_API_KEY: ""
          OPENROUTER_API_KEY: test-key-ci
          GEMINI_API_KEY: test-key-ci
          APCA_API_KEY: ""
          APCA_SECRET_KEY: ""
          FLASHALPHA_API_KEY: ""
          MARKETSTACK_API_KEY: ""
          API_SECRET_KEY: ""
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short --cov=. -m "not flaky_env"

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        # react-day-picker@8 peers date-fns ^2||^3 but our pin is 4.x — npm 7+
        # rejects this even though the lockfile already resolves it. Mirror the
        # local install flow so CI matches dev.
        run: npm ci --legacy-peer-deps

      # Deterministic, cheap gate: catch untracked frontend source files (e.g. a
      # dangling panel JSX + shared CSS dropped into the worktree by another
      # agent's checkout). A clean checkout with no `git add` must not ship
      # unversioned source files that break `npm run build` and the test
      # module-graph at collect time. Non-flaky: pure git + grep, no network,
      # no install. Fails closed so the run stops before the flaky Tests step.
      - name: Frontend filesystem integrity
        working-directory: ./frontend
        run: |
          set -euo pipefail
          echo "Checking for untracked frontend source files..."
          RAW=$(git ls-files --others --exclude-standard src/)
          UNTRACKED=$(echo "$RAW" | grep -E '\.(jsx|js|css|ts|tsx)$' || true)
          if [ -z "$UNTRACKED" ]; then
            echo "OK: no untracked frontend source files."
            exit 0
          fi
          echo "::error::Untracked frontend source files detected:"
          echo "$UNTRACKED"
          echo "Commit or remove them before merge. Run: git add <files> or rm <files>"
          exit 1

      # NOTE: no `lint` script exists in frontend/package.json and no eslint
      # config exists in the repo, so the previous `npm run lint || true`
      # step could never lint (missing script, failure masked). Removed
      # rather than faked. CRA's production build (next step, CI=true)
      # compiles with eslint warnings-as-errors and is the current
      # lint signal. A dedicated eslint flat config is a follow-up
      # candidate (probe 2026-09-07: no-undef-only surfaced real
      # findings, e.g. undefined `axios` uses, plus plugin-rule noise).

      - name: Tests
        working-directory: ./frontend
        # Measured baseline 2026-09-07 (node 26, npm ci --legacy-peer-deps):
        # 59 suites / 453 tests, all green. The old comment claiming 12/18
        # visual failures is stale; failures block the gate from here on.
        env:
          CI: true
        # CRA's `react-scripts test` runs jest in watch mode by default; --watchAll=false
        # forces single-run mode for CI.
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t confluence-decoder-backend .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t confluence-decoder-frontend .

      - name: Test Docker images
        run: |
          docker run --rm confluence-decoder-backend python -c "import server; print('Backend OK')"
          docker run --rm confluence-decoder-frontend ls -la build/
