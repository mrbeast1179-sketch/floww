name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Truth audit
        run: bash qc/audit/truth_audit.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install ruff
          ruff check . --output-format=github

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip install mypy
          mypy --ignore-missing-imports server.py || true

      - name: Run tests
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: confluence_decoder_test
          DATABENTO_API_KEY: ""
          POLYGON_API_KEY: ""
          ALPHA_VANTAGE_KEY: ""
          FINNHUB_API_KEY: ""
          APCA_API_KEY: ""
          APCA_SECRET_KEY: ""
          GEMINI_API_KEY: ""
          FLASHALPHA_API_KEY: ""
          MARKETSTACK_API_KEY: ""
          API_SECRET_KEY: ""
        run: |
          source .venv/bin/activate
          # NOTE: previously this command piped pytest through `head -100`.
          # That pipeline swallowed pytest's exit code (the shell's exit was
          # head's exit = always 0), so test failures did NOT fail CI.
          # Letting pytest's exit code propagate fixes that. GitHub Actions
          # handles long output natively — no need to truncate.
          python -m pytest tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        # react-day-picker@8 peers date-fns ^2||^3 but our pin is 4.x — npm 7+
        # rejects this even though the lockfile already resolves it. Mirror the
        # local install flow so CI matches dev.
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: ./frontend
        run: npm run lint 2>&1 || true

      - name: Tests
        working-directory: ./frontend
        env:
          CI: true
        # CRA's `react-scripts test` runs jest in watch mode by default; --watchAll=false
        # forces single-run mode for CI.
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t confluence-decoder-backend .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t confluence-decoder-frontend .

      - name: Test Docker images
        run: |
          docker run --rm confluence-decoder-backend python -c "import server; print('Backend OK')"
          docker run --rm confluence-decoder-frontend ls -la build/